[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ZantonV2 <172037461+Zantonv2@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/ZantonV2/Arbitrage_Dashboard"
homepage = "https://github.com/ZantonV2/Arbitrage_Dashboard"
description = "A desktop application for monitoring cryptocurrency arbitrage opportunities across multiple exchanges"
keywords = ["crypto", "arbitrage", "trading", "desktop", "rust"]
categories = ["finance", "gui"]

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }

# Web framework and HTTP
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
hyper = { version = "1.5", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "sqlite", "chrono", "uuid", "json"] }

# Decimal arithmetic for financial calculations
rust_decimal = { version = "1.39", features = ["serde"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.11", features = ["v4", "serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Configuration
config = "0.15"

# Cryptography for API key storage
ring = "0.17"
base64 = "0.22"

# HTTP client for exchange APIs
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }

# Concurrent data structures
dashmap = "6.1"
parking_lot = "0.12"

# Property-based testing
proptest = "1.5"

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# File watching for config hot-reload
notify = "8.2"

# Desktop notifications
notify-rust = "4.11"

# WebSocket utilities
futures-util = "0.3"
futures = "0.3"

# Async trait support
async-trait = "0.1"

# URL parsing
url = "2.5"

# Random number generation
rand = "0.9"

# Statistics calculations
statrs = "0.18"

# CSV export
csv = "1.3"

# Tauri for desktop app (optional, can be added later)
# tauri = { version = "2.1", features = ["api-all"] }
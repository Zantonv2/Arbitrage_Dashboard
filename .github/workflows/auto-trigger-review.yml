name: Auto-trigger OpenCode Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '!.github/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  trigger-review:
    name: Trigger OpenCode Review
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    steps:
      - name: Add /oc review comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "/oc review"

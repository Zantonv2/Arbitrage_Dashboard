name: PR Review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '!.github/**'
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  schedule:
    - cron: "0 13 * * *" # Daily at 1 PM UTC
  workflow_dispatch:

concurrency:
  group: pr-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  list-prs:
    name: List open PRs
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      PRS: ${{ steps.list.outputs.PRS }}
      HAS_PRS: ${{ steps.list.outputs.HAS_PRS }}
    steps:
      - name: List open PRs
        id: list
        run: |
          PRS=$(gh pr list --state open --json number -q '.[].number' | tr -d '[]\n, ')
          if [ -z "$PRS" ]; then
            echo "PRS=[]" >> $GITHUB_OUTPUT
            echo "HAS_PRS=false" >> $GITHUB_OUTPUT
          else
            echo "PRS=[${PRS}]" >> $GITHUB_OUTPUT
            echo "HAS_PRS=true" >> $GITHUB_OUTPUT
          fi

  review-pr:
    name: Review PR #${{ matrix.pr }}
    runs-on: ubuntu-latest
    needs: list-prs
    if: needs.list-prs.outputs.HAS_PRS == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    strategy:
      matrix:
        pr: ${{ fromJson(needs.list-prs.outputs.PRS) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Get PR details
        id: pr-details
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUM=${{ matrix.pr }}
          echo "NUMBER=$PR_NUM" >> $GITHUB_OUTPUT
          echo "TITLE=$(gh pr view $PR_NUM --json title -q '.title')" >> $GITHUB_OUTPUT
          echo "BODY=$(gh pr view $PR_NUM --json body -q '.body')" >> $GITHUB_OUTPUT
          echo "DIFF=$(gh pr diff $PR_NUM)" >> $GITHUB_OUTPUT

      - name: Install and run OpenCode CLI
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          npm install -g opencode
          opencode run --model opencode/minimax-m2.1-free --share false <<'EOF'
          Review pull request #${{ steps.pr-details.outputs.NUMBER }}: ${{ steps.pr-details.outputs.TITLE }}
          
          PR Description: ${{ steps.pr-details.outputs.BODY }}
          
          ## Review Checklist
          1. Bugs & Glitches: unwrap/panic calls, race conditions
          2. Performance: bottlenecks, unnecessary allocations
          3. Code Quality: bad practices, magic numbers, poor naming
          4. Security: hardcoded secrets, missing input validation
          5. Error Handling: proper error propagation
          6. Rust Specific: Decimal for financial calcs, async/await correctness
          
          Output your review as a concise summary.
          EOF

      - name: Post review comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUM=${{ steps.pr-details.outputs.NUMBER }}
          REPO="${{ github.repository }}"
          # Get OpenCode's review from the step output (if available) or post a placeholder
          curl -s -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d '{"body":"OpenCode review complete. See analysis in workflow logs."}' \
            "https://api.github.com/repos/${REPO}/issues/${PR_NUM}/comments"

  review-on-pr:
    name: Review PR on event
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'pull_request' && github.event.action != 'closed') ||
      contains(github.event.comment.body, '/oc review')
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install and run OpenCode CLI
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          npm install -g opencode
          opencode run --model opencode/minimax-m2.1-free --share false <<'EOF'
          Review pull request #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}
          
          PR Description: ${{ github.event.pull_request.body }}
          
          ## Review Checklist
          1. Bugs & Glitches: unwrap/panic calls, race conditions
          2. Performance: bottlenecks, unnecessary allocations
          3. Code Quality: bad practices, magic numbers, poor naming
          4. Security: hardcoded secrets, missing input validation
          5. Error Handling: proper error propagation
          6. Rust Specific: Decimal for financial calcs, async/await correctness
          
          Output your review as a concise summary.
          EOF

      - name: Post review comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          REPO="${{ github.repository }}"
          curl -s -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d '{"body":"OpenCode review complete. See analysis in workflow logs."}' \
            "https://api.github.com/repos/${REPO}/issues/${PR_NUM}/comments"

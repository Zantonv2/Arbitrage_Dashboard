name: PR Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '!.github/**'
  schedule:
    - cron: "0 13 * * *" # Daily at 1 PM UTC
  workflow_dispatch:

concurrency:
  group: pr-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run OpenCode PR Review
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        with:
          model: opencode/minimax-m2.1-free
          share: false
          prompt: |
            Review this pull request thoroughly:

            ## Review Checklist
            1. **Bugs & Glitches**: Potential bugs, unwrap/panic calls, race conditions
            2. **Performance**: Bottlenecks, unnecessary allocations, missing caches
            3. **Code Quality**: Bad practices, magic numbers, poor naming, duplication
            4. **Security**: Hardcoded secrets, missing input validation
            5. **Error Handling**: Proper error propagation, no silent failures
            6. **Rust Specific**: Proper error types, async/await correctness, Decimal for financial calcs

            ## Output Format
            Provide:
            - **Critical Issues**: Must fix before merge
            - **Suggestions**: Should consider
            - **Nitpicks**: Nice to have
            - **Overall**: APPROVE / REQUEST_CHANGES / COMMENT

            If this is a scheduled review, just output a summary of the PR state and any issues found.

      - name: Add review comment
        if: github.event_name == 'pull_request'
        run: |
          gh pr review ${{ github.event.pull_request.number }} \
            --body "OpenCode review complete. See comments for details." \
            --event REQUEST_CHANGES

  scheduled-pr-check:
    name: Check pending PRs
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: List open PRs
        run: |
          echo "## Pending PRs for Review"
          gh pr list --state open --json number,title,author,url -q '.[] | "- #\(.number): \(.title) by \(.author.login) - \(.url)"'

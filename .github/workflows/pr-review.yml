name: PR Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '!.github/**'
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  schedule:
    - cron: "0 13 * * *" # Daily at 1 PM UTC
  workflow_dispatch:

concurrency:
  group: pr-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  list-prs:
    name: List open PRs
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      PRS: ${{ steps.list.outputs.PRS }}
      HAS_PRS: ${{ steps.list.outputs.HAS_PRS }}
    steps:
      - name: List open PRs
        id: list
        run: |
          PRS=$(gh pr list --state open --json number -q '.[].number' | tr -d '[]\n, ')
          if [ -z "$PRS" ]; then
            echo "PRS=[]" >> $GITHUB_OUTPUT
            echo "HAS_PRS=false" >> $GITHUB_OUTPUT
          else
            echo "PRS=[${PRS}]" >> $GITHUB_OUTPUT
            echo "HAS_PRS=true" >> $GITHUB_OUTPUT
          fi

  review-pr:
    name: Review PR #${{ matrix.pr }}
    runs-on: ubuntu-latest
    needs: list-prs
    if: needs.list-prs.outputs.HAS_PRS == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    strategy:
      matrix:
        pr: ${{ fromJson(needs.list-prs.outputs.PRS) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Get PR details
        id: pr-details
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUM=${{ matrix.pr }}
          echo "NUMBER=$PR_NUM" >> $GITHUB_OUTPUT
          echo "TITLE=$(gh pr view $PR_NUM --json title -q '.title')" >> $GITHUB_OUTPUT
          echo "BODY=$(gh pr view $PR_NUM --json body -q '.body')" >> $GITHUB_OUTPUT
          echo "DIFF=$(gh pr diff $PR_NUM)" >> $GITHUB_OUTPUT

      - name: Run OpenCode for analysis
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr-details.outputs.NUMBER }}
          PR_TITLE: ${{ steps.pr-details.outputs.TITLE }}
          PR_BODY: ${{ steps.pr-details.outputs.BODY }}
          PR_DIFF: ${{ steps.pr-details.outputs.DIFF }}
        with:
          model: opencode/big-pickle
          share: false
          prompt: |
            Review pull request #${{ env.PR_NUMBER }}: ${{ env.PR_TITLE }}

            PR Description: ${{ env.PR_BODY }}

            ## Review Checklist
            1. **Bugs & Glitches**: Potential bugs, unwrap/panic calls, race conditions
            2. **Performance**: Bottlenecks, unnecessary allocations, missing caches
            3. **Code Quality**: Bad practices, magic numbers, poor naming, duplication
            4. **Security**: Hardcoded secrets, missing input validation
            5. **Error Handling**: Proper error propagation, no silent failures
            6. **Rust Specific**: Proper error types, async/await correctness, Decimal for financial calcs

            Output only your review as a plain text comment to post on GitHub. Be concise but thorough.

      - name: Post review comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUM=${{ steps.pr-details.outputs.NUMBER }}
          REPO="${{ github.repository }}"
          curl -s -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d '{"body":"OpenCode review complete. See analysis in workflow logs."}' \
            "https://api.github.com/repos/${REPO}/issues/${PR_NUM}/comments"

  review-on-pr:
    name: Review PR on event
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'pull_request' && github.event.action != 'closed') ||
      contains(github.event.comment.body, '/oc review')
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Run OpenCode for analysis
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        with:
          model: opencode/big-pickle
          share: false
          prompt: |
            Review pull request #${{ env.PR_NUMBER }}: ${{ env.PR_TITLE }}

            ## Review Checklist
            1. **Bugs & Glitches**: Potential bugs, unwrap/panic calls, race conditions
            2. **Performance**: Bottlenecks, unnecessary allocations, missing caches
            3. **Code Quality**: Bad practices, magic numbers, poor naming, duplication
            4. **Security**: Hardcoded secrets, missing input validation
            5. **Error Handling**: Proper error propagation, no silent failures
            6. **Rust Specific**: Proper error types, async/await correctness, Decimal for financial calcs

            Output your review as a plain text comment. Be concise but thorough.

            **IMPORTANT:** If you find any critical issues (crashes, security vulnerabilities, or major bugs), include "CRITICAL_ISSUES_FOUND: true" in your output.

      - name: Check for critical issues and trigger auto-fix
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PR_NUM=${{ github.event.pull_request.number }}

          # Check OpenCode's output for critical issues marker
          if grep -q "CRITICAL_ISSUES_FOUND: true" "$GITHUB_WORKSPACE/opencode-output.txt" 2>/dev/null || \
             grep -q "CRITICAL_ISSUES_FOUND: true" "$GITHUB_WORKSPACE/opencode.log" 2>/dev/null; then

            echo "Critical issues detected! Triggering auto-fix..."

            # Create issue for auto-fix
            ISSUE_BODY="## Critical Issues Found in PR #$PR_NUM

            OpenCode review detected critical issues that need immediate fixing. Please analyze the PR and implement necessary fixes.

            ## Context
            - PR: #$PR_NUM
            - Review triggered by: auto-review workflow
            - Source: review complaints

            /oc fix"

            gh issue create \
              --title "fix: critical issues in PR #$PR_NUM" \
              --body "$ISSUE_BODY" \
              --label "bug,urgent,auto-generated"

          fi

      - name: Post review comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          REPO="${{ github.repository }}"
          curl -s -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d '{"body":"OpenCode review complete. See analysis in workflow logs."}' \
            "https://api.github.com/repos/${REPO}/issues/${PR_NUM}/comments"

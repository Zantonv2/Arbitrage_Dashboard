name: PR Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '!.github/**'
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  schedule:
    - cron: "0 13 * * *" # Daily at 1 PM UTC
  workflow_dispatch:

concurrency:
  group: pr-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  list-prs:
    name: List open PRs
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      PRS: ${{ steps.list.outputs.PRS }}
    steps:
      - name: List open PRs
        id: list
        run: |
          PRS=$(gh pr list --state open --json number -q '.[].number' | tr -d '[]\n, ')
          echo "PRS=[${PRS}]" >> $GITHUB_OUTPUT

  review-pr:
    name: Review PR #${{ matrix.pr }}
    runs-on: ubuntu-latest
    needs: list-prs
    strategy:
      matrix:
        pr: ${{ fromJson(needs.list-prs.outputs.PRS) }}
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Get PR details
        id: pr-details
        run: |
          PR_NUM=${{ matrix.pr }}
          echo "NUMBER=$PR_NUM" >> $GITHUB_OUTPUT
          echo "TITLE=$(gh pr view $PR_NUM --json title -q '.title')" >> $GITHUB_OUTPUT

      - name: Run OpenCode PR Review
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          PR_NUMBER: ${{ steps.pr-details.outputs.NUMBER }}
          PR_TITLE: ${{ steps.pr-details.outputs.TITLE }}
        with:
          use_github_token: true
          model: opencode/minimax-m2.1-free
          share: false
          prompt: |
            Review pull request #${{ env.PR_NUMBER }}: ${{ env.PR_TITLE }}

            ## Review Checklist
            1. **Bugs & Glitches**: Potential bugs, unwrap/panic calls, race conditions
            2. **Performance**: Bottlenecks, unnecessary allocations, missing caches
            3. **Code Quality**: Bad practices, magic numbers, poor naming, duplication
            4. **Security**: Hardcoded secrets, missing input validation
            5. **Error Handling**: Proper error propagation, no silent failures
            6. **Rust Specific**: Proper error types, async/await correctness, Decimal for financial calcs

            ## Output Format
            Provide review as a comment on the PR with:
            - **Critical Issues**: Must fix before merge
            - **Suggestions**: Should consider
            - **Nitpicks**: Nice to have
            - **Overall**: APPROVE / REQUEST_CHANGES / COMMENT

      - name: Add review status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM=${{ steps.pr-details.outputs.NUMBER }}
          REPO="${{ github.repository }}"
          curl -s -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d '{"body":"OpenCode review complete. See comments for details.","event":"REQUEST_CHANGES"}' \
            "https://api.github.com/repos/${REPO}/pulls/${PR_NUM}/reviews"

  review-on-pr:
    name: Review PR on event
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'pull_request' && github.event.action != 'closed') ||
      contains(github.event.comment.body, '/oc review')
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Run OpenCode PR Review
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        with:
          use_github_token: true
          model: opencode/minimax-m2.1-free
          share: false
          prompt: |
            Review pull request #${{ env.PR_NUMBER }}: ${{ env.PR_TITLE }}

            ## Review Checklist
            1. **Bugs & Glitches**: Potential bugs, unwrap/panic calls, race conditions
            2. **Performance**: Bottlenecks, unnecessary allocations, missing caches
            3. **Code Quality**: Bad practices, magic numbers, poor naming, duplication
            4. **Security**: Hardcoded secrets, missing input validation
            5. **Error Handling**: Proper error propagation, no silent failures
            6. **Rust Specific**: Proper error types, async/await correctness, Decimal for financial calcs

            ## Output Format
            Provide review as a comment on the PR with:
            - **Critical Issues**: Must fix before merge
            - **Suggestions**: Should consider
            - **Nitpicks**: Nice to have
            - **Overall**: APPROVE / REQUEST_CHANGES / COMMENT

      - name: Add review status
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          REPO="${{ github.repository }}"
          curl -s -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d '{"body":"OpenCode review complete. See comments for details.","event":"REQUEST_CHANGES"}' \
            "https://api.github.com/repos/${REPO}/pulls/${PR_NUM}/reviews"

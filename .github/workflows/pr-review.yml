name: PR Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '!.github/**'
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  schedule:
    - cron: "0 13 * * *" # Daily at 1 PM UTC
  workflow_dispatch:

concurrency:
  group: pr-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'pull_request' && github.event.action != 'closed') ||
      contains(github.event.comment.body, '/oc review')
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Run OpenCode PR Review
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          use_github_token: true
          model: opencode/minimax-m2.1-free
          share: false
          prompt: |
            ${{ github.event_name == 'issue_comment' && 'Review the issue/PR and address the user request in the comment.' || github.event_name == 'pull_request_review_comment' && 'Review the spec and address the reviewer comment.' || 'Review this pull request thoroughly:' }}

            ## Review Checklist
            1. **Bugs & Glitches**: Potential bugs, unwrap/panic calls, race conditions
            2. **Performance**: Bottlenecks, unnecessary allocations, missing caches
            3. **Code Quality**: Bad practices, magic numbers, poor naming, duplication
            4. **Security**: Hardcoded secrets, missing input validation
            5. **Error Handling**: Proper error propagation, no silent failures
            6. **Rust Specific**: Proper error types, async/await correctness, Decimal for financial calcs

            ## Output Format
            Provide:
            - **Critical Issues**: Must fix before merge
            - **Suggestions**: Should consider
            - **Nitpicks**: Nice to have
            - **Overall**: APPROVE / REQUEST_CHANGES / COMMENT

            If this is a scheduled review, just output a summary of the PR state and any issues found.

      - name: Add review comment
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          REPO="${{ github.repository }}"
          curl -s -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d '{"body":"OpenCode review complete. See comments for details.","event":"REQUEST_CHANGES"}' \
            "https://api.github.com/repos/${REPO}/pulls/${PR_NUM}/reviews"

  scheduled-pr-check:
    name: Check pending PRs
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: List open PRs
        run: |
          export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          echo "## Pending PRs for Review"
          gh pr list --state open --json number,title,author,url -q '.[] | "- #\(.number): \(.title) by \(.author.login) - \(.url)"'

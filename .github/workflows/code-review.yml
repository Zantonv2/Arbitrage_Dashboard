name: Code Review
on:
  schedule:
    - cron: "0 8 * * *" # Daily at 8 AM UTC
  issue_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  group: code-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/oc scan'))
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run OpenCode Code Review
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/grok-code
          share: false
          prompt: |
            ${{ github.event_name == 'issue_comment' && 'Scan the entire codebase for issues immediately.' || 'Perform a comprehensive code review of the entire codebase.' }}

            Use these specialized agents IN PARALLEL for thorough analysis:
            - @critical-1: Find panics, unwraps, OOB access, division by zero
            - @security-1: Find auth bypass, injection, crypto failures, secrets
            - @performance-1: Find memory leaks, slow algorithms, missing caches
            - @reliability-1: Find missing error handling, poor errors, resource leaks
            - @testing-1: Find missing tests, low coverage, untested edge cases
            - @tech-debt-1: Find code duplication, dead code, magic numbers, poor naming

            ## Consolidation Strategy (CRITICAL)
            You MUST consolidate related findings into 10-15 maximum issues. Group findings by:
            1. Root cause (e.g., all unwrap() panics → one issue)
            2. Affected module (e.g., all connector issues → one issue)
            3. Category (e.g., all performance issues → one issue)
            4. Pattern (e.g., all missing tests → one issue)

            Each consolidated issue should:
            - Merge all related findings into one comprehensive description
            - List all affected files and line numbers
            - Include reproduction steps for each finding
            - Provide unified acceptance criteria
            - Map to the highest priority among merged findings

            ## Output Format
            Create markdown files in `docs/outputs/issues/` directory with this exact structure:

            ```markdown
            ---
            title: [P1-P3] Clear, consolidated title (<70 chars)
            problem: One-sentence summary of the consolidated issue
            impact: User/system impact of all merged findings
            reproduction: |
              Step-by-step reproduction for each finding:
              1. First finding reproduction
              2. Second finding reproduction
              ...
            acceptance_criteria: |
              - Unified acceptance criteria covering all findings
              - Each criterion should be testable
            effort: 1-5 (based on most complex finding)
            risk: High|Medium|Low (highest risk among findings)
            category: security|critical|performance|reliability|testing|tech-debt
            files:
            - path/to/file1.rs:line1
            - path/to/file2.rs:line2
            labels: security|crash|performance|error-handling|testing|debt
            ---
            ```

            ## Available Repository Labels (USE ONLY THESE)
            Standard GitHub labels:
            - bug, documentation, duplicate, enhancement, good first issue, help wanted, invalid, question, wontfix

            Project-specific labels:
            - refactoring, technical-debt, testing, performance, safety, critical, security, financial, reliability, trading
            - api-design, validation, calculation, concurrency, optimization, maintainability, refactor, test-coverage
            - robustness, error-handling, code-quality

            ## Label Mapping Guidelines
            Map findings to appropriate labels:
            - Security issues: security, safety, critical
            - Crashes/panics: bug, critical, crash
            - Performance: performance, optimization
            - Error handling: error-handling, robustness, reliability
            - Testing: testing, test-coverage
            - Code quality: technical-debt, code-quality, maintainability, refactoring, refactor
            - Financial calculations: financial, calculation, validation
            - Trading logic: trading, api-design
            - Concurrency: concurrency, reliability

            ## Priority Guidelines
            - P1: Bugs, security vulnerabilities, crashes, data loss
            - P2: Performance issues, missing critical tests, reliability concerns
            - P3: Code quality, documentation, refactoring, minor improvements

            ## Final Output
            After creating all issue files, output a summary:
            ```
            ## Code Review Summary
            - Total issues created: X (must be 10-15)
            - By priority: P1: X, P2: X, P3: X
            - By category: security: X, critical: X, performance: X, reliability: X, testing: X, tech-debt: X
            - Files analyzed: X
            - Findings consolidated: Y → X issues
            ```

      - name: Create GitHub Issues from Generated Files
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Wait for OpenCode to finish and create files
          echo "Waiting for OpenCode to generate issue files..."
          sleep 30

          # Check if findings directory exists
          if [ -d "docs/outputs/issues" ]; then
            echo "Found findings directory"

            # Find all markdown files (excluding .gitkeep)
            FINDINGS=$(find docs/outputs/issues -name "*.md" -type f ! -name ".gitkeep" 2>/dev/null)

            if [ -z "$FINDINGS" ]; then
              echo "No issue files found in docs/outputs/issues"
              exit 0
            fi

            ISSUE_COUNT=0
            for finding in $FINDINGS; do
              # Extract metadata from finding file
              TITLE=$(grep "^title:" "$finding" 2>/dev/null | head -1 | sed 's/title: //' | tr -d '"')
              LABELS=$(grep "^labels:" "$finding" 2>/dev/null | head -1 | sed 's/labels: //' | tr -d '"')

              if [ -n "$TITLE" ]; then
                # Read the entire file as the issue body
                BODY=$(cat "$finding")
                echo "Creating issue: $TITLE"

                # Create labels string - only use labels that exist in the repository
                if [ -n "$LABELS" ]; then
                  # Split labels by | and validate each one
                  VALID_LABELS=""
                  IFS='|' read -ra LABEL_ARRAY <<< "$LABELS"
                  for label in "${LABEL_ARRAY[@]}"; do
                    label=$(echo "$label" | xargs) # trim whitespace
                    # Check if label exists (using gh label list)
                    if gh label list --search "$label" --limit 1 --json name --jq '.[].name' | grep -q "^${label}$"; then
                      if [ -n "$VALID_LABELS" ]; then
                        VALID_LABELS="$VALID_LABELS,$label"
                      else
                        VALID_LABELS="$label"
                      fi
                    fi
                  done
                  LABEL_STRING="$VALID_LABELS"
                fi

                # Add auto-generated label if any valid labels found
                if [ -n "$LABEL_STRING" ]; then
                  LABEL_STRING="auto-generated,$LABEL_STRING"
                else
                  LABEL_STRING="auto-generated"
                fi

                # Create GitHub issue using gh CLI
                gh issue create \
                  --title "$TITLE" \
                  --body "$BODY" \
                  --label "$LABEL_STRING" \
                  --repo "$GITHUB_REPOSITORY" 2>/dev/null || echo "Failed to create issue for $finding"

                ISSUE_COUNT=$((ISSUE_COUNT + 1))
              fi
            done

            echo "Created $ISSUE_COUNT GitHub issues from generated files"

            # Clean up generated files after creating issues
            find docs/outputs/issues -name "*.md" -type f ! -name ".gitkeep" -delete
            echo "Cleaned up generated issue files"
          else
            echo "No findings directory found"
          fi

name: Code Review
on:
  schedule:
    - cron: "0 8 * * *" # Daily at 8 AM UTC
  issue_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  group: code-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/oc scan'))
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run OpenCode Code Review
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          share: false
          prompt: |
            ${{ github.event_name == 'issue_comment' && 'Scan the entire codebase for issues immediately.' || 'Perform a comprehensive code review of the entire codebase.' }}

            ## Review Focus Areas

            ### Bugs & Glitches
            - unwrap()/expect() on external data
            - Division by zero, missing error handling
            - Race conditions, invalid state transitions

            ### Performance
            - Unnecessary cloning, O(n²) algorithms
            - Memory leaks, missing caches
            - Blocking in async code

            ### Code Quality
            - Magic numbers, poor naming
            - Code duplication (>3 lines)
            - Dead code, functions >50 lines
            - Missing docs on public APIs

            ### Order Book Validation
            - Check bids >= asks (no arbitrage within single exchange)

            ### Technical Debt
            - TODO/FIXME comments
            - Hardcoded values, missing tests

            ### Security
            - Hardcoded secrets
            - Missing input validation
            - Unsafe operations

            ## Rust-Specific
            - f64 instead of Decimal
            - Proper error types (thiserror)
            - Async/await correctness
            - Concurrency primitives (Mutex vs RwLock vs DashMap)

            ## Output
            For each issue found, create a GitHub issue with:
            ```yaml
            ---
            title: [P1-P3] Clear title (<70 chars)
            problem: One sentence
            impact: User/system impact
            effort: 1-5
            risk: High|Medium|Low
            category: security|critical|performance|reliability|testing|tech-debt
            files:
            - src/file.rs
            labels: security|crash|performance|error-handling|testing|debt
            ---
            ```

            Priority: P1 (bugs/security), P2 (performance/tests), P3 (quality/refactoring).

            IMPORTANT: Save ALL findings to individual files in docs/outputs/issues/ directory first.
            Then consolidate similar issues and create maximum 15 GitHub issues total.
            For each consolidated issue, run: gh issue create --title "TITLE" --body "BODY" --label "LABELS"
            Output summary: how many issues created by category and priority.

      - name: Create GitHub Issues from Findings
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Wait for OpenCode to finish
          sleep 10

          # Check if OpenCode created its own branch with findings
          OPENCODE_BRANCH=$(git branch -r | grep opencode | head -1 | sed 's/origin\///')
          if [ -n "$OPENCODE_BRANCH" ]; then
            echo "Checking OpenCode branch: $OPENCODE_BRANCH"
            git checkout "$OPENCODE_BRANCH"
          fi

          # Check if findings directory exists
          if [ -d "docs/outputs/issues" ]; then
            echo "Found findings directory"

            # Read all findings and create consolidated issues (max 15)
            FINDINGS=$(find docs/outputs/issues -name "*.md" -type f 2>/dev/null | head -15)

            ISSUE_COUNT=0
            for finding in $FINDINGS; do
              if [ $ISSUE_COUNT -ge 15 ]; then
                echo "Reached maximum 15 issues limit"
                break
              fi

              # Extract metadata from finding file
              TITLE=$(grep "^title:" "$finding" 2>/dev/null | head -1 | sed 's/title: //' | tr -d '"')
              LABELS=$(grep "^labels:" "$finding" 2>/dev/null | head -1 | sed 's/labels: //' | tr -d '"')

              if [ -n "$TITLE" ] && [ -n "$LABELS" ]; then
                # Create GitHub issue
                BODY=$(cat "$finding")
                echo "Creating issue: $TITLE"

                gh issue create \
                  --title "$TITLE" \
                  --body "$BODY" \
                  --label "$LABELS,auto-generated,code-review" \
                  --assignee "" 2>/dev/null || echo "Failed to create issue for $finding"

                ISSUE_COUNT=$((ISSUE_COUNT + 1))
              fi
            done

            echo "Created $ISSUE_COUNT GitHub issues from findings"

            # Switch back to main branch
            git checkout main
          else
            echo "No findings directory found"
          fi

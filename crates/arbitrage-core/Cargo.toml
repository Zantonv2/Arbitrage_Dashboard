[package]
name = "arbitrage-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core data structures and business logic for the arbitrage dashboard"

[features]
default = ["all-exchanges", "all-strategies", "tracing", "metrics", "test-utils"]
all-exchanges = ["okx", "bybit", "mexc", "gateio", "bitstamp", "kraken"]
okx = []
bybit = []
mexc = []
gateio = []
bitstamp = []
kraken = []
all-strategies = [
    "cex-arbitrage",
    "funding-rate-arbitrage",
    "stablecoin-arbitrage",
    "cross-exchange-arbitrage",
    "new-listing-arbitrage",
    "spot-perp-arbitrage",
    "convergence-arbitrage",
    "hedged-funding",
    "latency-arbitrage",
    "spread-capture",
]
cex-arbitrage = []
funding-rate-arbitrage = []
stablecoin-arbitrage = []
cross-exchange-arbitrage = []
new-listing-arbitrage = []
spot-perp-arbitrage = []
convergence-arbitrage = []
hedged-funding = []
latency-arbitrage = []
spread-capture = []
test-utils = []
tracing = []
metrics = []
simulator = []
dev = ["test-utils"]

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rust_decimal = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
statrs = { workspace = true }
rand = { workspace = true }
base64 = "0.22"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
reqwest = { workspace = true }
sqlx = { workspace = true }
rustc-hash = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tokio-test = "0.4"
criterion = { workspace = true }
    { base = "SOL", quote = "USDT" },
    { base = "BNB", quote = "USDT" },
    { base = "XRP", quote = "USDT" },
    { base = "ADA", quote = "USDT" },
    { base = "AVAX", quote = "USDT" },
    { base = "DOT", quote = "USDT" },
